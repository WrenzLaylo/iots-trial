<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ page.title }}</title>
<meta name="description" content="{{ page.description }}">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#002d45">
<link rel="icon" href="/assets/img/favicon.ico">
<link rel="preload" href="/assets/fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/site.css?v={{ build_id }}">
<script>document.documentElement.classList.replace('no-js', 'js');</script>
<script type="module" src="/assets/js/site.js?v={{ build_id }}" onerror="document.documentElement.classList.replace('js', 'no-js')"></script>
<script nomodule>document.documentElement.classList.replace('js', 'no-js');</script>
{% for block in page.jsonld %}<script type="application/ld+json">{{ block | tojson }}</script>
{% endfor %}
</head>
<body class="page-{{ page.slug }}">
<a class="skip-link" href="#main">Skip to main content</a>
{% include "_header.html" %}
<main id="main" tabindex="-1">
{% block main %}{% endblock %}
</main>
{% include "_footer.html" %}
</body>
</html>
